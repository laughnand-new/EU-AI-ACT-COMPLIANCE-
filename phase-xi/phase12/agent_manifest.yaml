# Phase XII — Agent Manifest
# Canonical substrate-native node configuration

agent:
  id: "node-001"
  type: "core"              # core | observer | gateway
  version: "PhaseXII"

identity:
  lineage:
    - "Laughnand"
    - "NODE"
    - "node-001"
  signature: "<auto-generated>"
  revoked: false

trust_state:
  mode: "active"
  last_rebuild_ledger_index: 0
  trust_index_hash: "<computed>"

consensus:
  role: "voter"             # voter | proposer | observer
  quorum_group: "default"
  message_types:
    - PROPOSE_ACTION
    - VOTE_ACTION
    - COMMIT_ACTION
    - SYNC_LEDGER
    - TRUST_STATE_SNAPSHOT
    - NODE_HEARTBEAT

ledger:
  sync:
    start_index: 0
    auto_repair: true
  storage_backend: "mongo"
  collection: "phase12_ledger"

hlc:
  drift_tolerance_ms: 5
  sync_on_start: true

network:
  listen: "0.0.0.0:9090"
  peers:
    - "node-002:9090"
    - "node-003:9090"

security:
  require_signed_messages: true
  reject_revoked_nodes: true
  reject_revoked_identities: true
